  <section class="appointment-section fade-in">
    <h1>Book Your Appointment</h1>
    <p>Please fill out the form below and our staff will contact you to confirm your appointment.</p>

        <form class="appointment-form" id="appointmentForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Your full name" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" placeholder="+27 xxxxxxxxxx" required>

      <label for="service">Select Service</label>
      <select id="service" name="service" required>
        <option value="">-- Choose a service --</option>
        <option value="consultation">Work Shops</option>
        <option value="pharmacy">Guest Speakers</option>
        <option value="lab">Hormonal Therapy</option>
         <option value="vaccination">Supportive Treatments</option>
      </select>

      <label for="date">Preferred Date</label>
      <input type="date" id="date" name="date" required>

      <label for="time">Preferred Time</label>
      <input type="time" id="time" name="time" required>

      <button type="submit" class="btn primary">Submit Appointment</button>
    </form>
    
    <div id="appointmentResponse" class="response-message" style="display:none;">
    </div>
  </section>
